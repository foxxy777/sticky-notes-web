<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📋 便签</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #30363d;
      --text: #c9d1d9;
      --dim: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --wwd: #58a6ff;
      --wwdb: #d29922;
      --newdb: #bc8cff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .header h1 { font-size: 17px; font-weight: 600; white-space: nowrap; }
    .status {
      font-size: 12px; color: var(--dim);
      display: flex; align-items: center; gap: 6px;
      flex: 1; justify-content: center;
    }
    .status .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green); flex-shrink: 0;
    }
    .status.saving .dot { background: var(--yellow); animation: pulse 1s infinite; }
    .status.error .dot { background: var(--red); }
    .status.unsaved .dot { background: var(--dim); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .icon-btn {
      background: none; border: 1px solid var(--border);
      color: var(--dim); cursor: pointer;
      font-size: 15px; padding: 4px 10px;
      border-radius: 6px; white-space: nowrap;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--dim); }
    .icon-btn:disabled { opacity: .35; cursor: default; }
    .icon-btn:disabled:hover { color: var(--dim); border-color: var(--border); }
    .container { max-width: min(2400px, 96vw); margin: 0 auto; padding: 12px 16px; }
    .section { margin-bottom: 20px; }
    .section-title {
      font-size: 13px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 6px; padding-left: 10px;
      border-left: 3px solid;
      display: flex; align-items: center;
    }
    .wipe-btn {
      margin-left: 10px; background: none; border: 1px solid var(--border);
      color: var(--dim); font-size: 11px; font-weight: 600;
      padding: 2px 9px; border-radius: 5px; cursor: pointer;
      opacity: .5; transition: opacity .15s, color .15s, border-color .15s;
      text-transform: none; letter-spacing: 0;
    }
    .wipe-btn:hover { opacity: 1; color: var(--red); border-color: var(--red); }
    .modal .btn-row { display: flex; gap: 8px; }
    .modal .btn-row button { flex: 1; }
    .modal .btn-cancel {
      background: none; border: 1px solid var(--border); color: var(--dim);
    }
    .modal .btn-cancel:hover { color: var(--text); border-color: var(--dim); filter: none; }
    .modal .btn-danger { background: var(--red); border: none; }
    .modal .btn-danger:hover { filter: brightness(1.1); }
    .section.wwd .section-title { border-color: var(--wwd); color: var(--wwd); }
    .section.wwdb .section-title { border-color: var(--wwdb); color: var(--wwdb); }
    .section.newdb .section-title { border-color: var(--newdb); color: var(--newdb); }
    .row {
      display: flex; align-items: stretch; gap: 6px;
      margin-bottom: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px;
    }
    .row-label {
      flex-shrink: 0; width: 60px;
      font-size: 12px; font-weight: 700;
      color: var(--dim);
      display: flex; align-items: center; justify-content: center;
    }
    .row.wwd .row-label { color: var(--wwd); }
    .row.wwdb .row-label { color: var(--wwdb); }
    .row.newdb .row-label { color: var(--newdb); }
    .inputs {
      flex: 1; display: grid;
      grid-template-columns: 0.6fr 1.2fr 3fr 1.5fr 1.5fr;
      gap: 4px;
    }
    .input-wrap { position: relative; display: flex; }
    .input-box { position: relative; flex: 1; min-width: 0; display: flex; }
    .input-wrap input {
      background: var(--bg); border: 1px solid transparent;
      color: var(--text); padding: 7px 10px;
      border-radius: 4px; font-size: 14px;
      outline: none; width: 100%; min-width: 0;
      transition: border-color .15s;
    }
    .input-wrap input:focus { border-color: var(--accent); }
    .input-wrap input.col-link { color: var(--accent); }
    .input-wrap input::placeholder { color: var(--dim); opacity: 0.5; }
    .clear-btn {
      flex-shrink: 0; width: 20px; margin-left: 3px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; border-radius: 4px;
      color: var(--dim); opacity: .45; font-size: 12px;
      cursor: pointer;
    }
    .clear-btn:hover { opacity: 1; color: var(--red); }
    .open-link {
      position: absolute; right: 4px; top: 50%;
      transform: translateY(-50%);
      background: var(--surface2); border: none;
      color: var(--accent); cursor: pointer;
      font-size: 12px; padding: 2px 5px;
      border-radius: 3px; display: none;
    }
    .input-wrap input:not(:focus) ~ .open-link.has-url { display: block; }
    /* 可拖拽列宽手柄 */
    .col-handle {
      position: absolute; right: -6px; top: 0; bottom: 0;
      width: 12px; cursor: col-resize; z-index: 5;
      touch-action: none;
    }
    .col-handle::after {
      content: ""; position: absolute; top: 12%; bottom: 12%; left: 4px; right: 4px;
      border-radius: 2px; background: var(--border);
      opacity: 0; transition: opacity .15s, background .15s;
    }
    .row:hover .col-handle::after { opacity: .6; }
    .col-handle:hover::after, .col-handle.dragging::after { opacity: 1; background: var(--accent); }
    @media (max-width: 760px) {
      .header { flex-wrap: wrap; }
      .status { order: 3; flex-basis: 100%; justify-content: flex-start; }
    }
    @media (max-width: 700px) {
      .row { flex-direction: column; }
      .row-label { width: 100%; justify-content: flex-start; padding-left: 4px; height: 22px; }
      .inputs { grid-template-columns: 1fr 1fr; }
      .col-handle { display: none; }
    }
    @media (max-width: 480px) {
      .inputs { grid-template-columns: 1fr; }
    }
    /* Modal */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      display: none;
      align-items: center; justify-content: center;
      z-index: 200; padding: 16px;
    }
    .overlay.show { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      max-width: 420px; width: 100%;
    }
    .modal h2 { font-size: 19px; margin-bottom: 6px; }
    .modal p { color: var(--dim); font-size: 13px; line-height: 1.7; margin-bottom: 12px; }
    .modal a { color: var(--accent); }
    .modal input {
      width: 100%; background: var(--bg);
      border: 1px solid var(--border); color: var(--text);
      padding: 9px 12px; border-radius: 6px;
      font-size: 14px; outline: none; margin-bottom: 10px;
    }
    .modal input:focus { border-color: var(--accent); }
    .modal button {
      width: 100%; background: var(--accent); color: #fff;
      border: none; padding: 10px; border-radius: 6px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .modal button:hover { filter: brightness(1.1); }
    .modal .hint { font-size: 11px; color: var(--dim); margin-top: 8px; }
    .err-msg { color: var(--red); font-size: 12px; margin-bottom: 6px; display: none; }
    .loading-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 50vh; color: var(--dim); font-size: 14px;
    }
    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: 28px;
      transform: translateX(-50%) translateY(8px);
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 9px 16px; border-radius: 8px; font-size: 13px; z-index: 300;
      opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    /* Snapshot viewer — 左右两栏 */
    .snap-modal {
      max-width: min(1240px, 96vw); width: 100%;
      max-height: 88vh; padding: 0; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .snap-body { display: flex; flex: 1; min-height: 0; align-items: stretch; }
    .snap-side {
      width: 256px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--bg);
      display: flex; flex-direction: column; min-height: 0;
    }
    .snap-side-head {
      padding: 14px 14px 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .snap-side-head h2 { margin: 0; font-size: 17px; flex: 1; }
    .snap-total {
      font-size: 11px; color: var(--dim);
      background: var(--surface2); border: 1px solid var(--border);
      padding: 2px 8px; border-radius: 10px;
    }
    .snap-list {
      flex: 1; overflow-y: auto; padding: 8px 12px 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .snap-item {
      cursor: pointer;
      padding: 12px 14px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--surface2);
      transition: border-color .15s, background .15s;
    }
    .snap-item:hover { border-color: var(--dim); }
    .snap-item.active { border-color: var(--accent); background: rgba(88,166,255,.1); }
    .snap-item .time { font-size: 13px; font-weight: 600; }
    .snap-item.active .time { color: var(--accent); }
    .snap-item .count { font-size: 11px; color: var(--dim); margin-top: 3px; }
    .snap-none {
      color: var(--dim); font-size: 12px; text-align: center;
      padding: 28px 8px; line-height: 2;
    }
    .snap-main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
    .snap-main-head {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 13px 20px; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .snap-title {
      font-size: 14px; font-weight: 600; color: var(--dim);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .snap-title.ready { color: var(--text); }
    .snap-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .snap-actions .icon-btn { padding: 5px 12px; font-size: 13px; }
    .snap-actions .primary { background: var(--accent); color: #fff; border-color: transparent; }
    .snap-actions .primary:hover { color: #fff; border-color: transparent; filter: brightness(1.1); }
    .snap-actions .danger:hover { color: var(--red); border-color: var(--red); }
    .snap-preview { flex: 1; overflow-y: auto; padding: 18px 24px 24px; min-height: 0; }
    .snap-preview .section-title { margin: 20px 0 12px; font-size: 14px; }
    .snap-preview .section-title:first-child { margin-top: 4px; }
    .snap-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 10px;
    }
    .snap-card-head {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .snap-card .chip {
      font-size: 12px; font-weight: 700; flex-shrink: 0;
      padding: 1px 10px; border-radius: 999px;
      border: 1px solid;
    }
    .snap-card .st { font-size: 12px; font-weight: 600; }
    .snap-card .st-ok { color: var(--green); }
    .snap-card .st-warn { color: var(--yellow); }
    .snap-card .tm { font-size: 12px; color: var(--dim); }
    .snap-card .lnk {
      margin-left: auto; font-size: 12px; color: var(--accent);
      text-decoration: none; border: 1px solid var(--border);
      padding: 1px 9px; border-radius: 6px;
    }
    .snap-card .lnk:hover { border-color: var(--accent); }
    .snap-card .main {
      font-size: 14px; line-height: 1.65; color: var(--text);
      white-space: pre-wrap; word-break: break-word;
    }
    .snap-card .sub {
      display: flex; flex-wrap: wrap; gap: 6px 20px;
      font-size: 12px; color: var(--dim); margin-top: 6px;
    }
    .snap-card .sub b { color: var(--text); font-weight: 600; margin-left: 4px; }
    .snap-placeholder {
      display: flex; align-items: center; justify-content: center;
      font-size: 42px; opacity: .25; min-height: 220px;
    }
    @media (max-width: 760px) {
      .snap-modal { max-height: 92vh; }
      .snap-body { flex-direction: column; }
      .snap-side { width: 100%; max-height: 178px; border-right: none; border-bottom: 1px solid var(--border); }
      .snap-list { flex-direction: row; overflow-x: auto; overflow-y: hidden; }
      .snap-item { min-width: 148px; flex-shrink: 0; }
      .snap-none { padding: 12px 8px; }
      .snap-preview { padding: 12px 14px 14px; }
      .snap-card { padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📋 便签</h1>
    <div class="status" id="status">
      <span class="dot"></span><span class="text">加载中...</span>
    </div>
    <button class="icon-btn" id="undoBtn" onclick="doUndo()" title="撤销 (Ctrl+Z)" disabled>↩ 撤销</button>
    <button class="icon-btn" id="redoBtn" onclick="doRedo()" title="重做 (Ctrl+Shift+Z / Ctrl+Y)" disabled>↪ 重做</button>
    <button class="icon-btn" onclick="forceSave()">💾 保存</button>
    <button class="icon-btn" onclick="takeSnapshot()">📸 存快照</button>
    <button class="icon-btn" id="snapBtn" onclick="openSnaps()">🕘 快照</button>
    <button class="icon-btn" onclick="openSetup()">⚙️</button>
  </div>
  <div class="container" id="app">
    <div class="loading-screen">加载中...</div>
  </div>
  <div class="overlay" id="setupOverlay">
    <div class="modal">
      <h2>🔑 设置 Token</h2>
      <p>需要一个 GitHub Token（仅 <code>gist</code> 权限）来同步数据。每个浏览器只需输入一次。</p>
      <p>👉 <a href="https://github.com/settings/tokens/new?scopes=gist&description=StickyNotes" target="_blank">点这里创建</a> → 复制粘贴到下方：</p>
      <div class="err-msg" id="errMsg"></div>
      <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
      <button onclick="saveToken()">确认</button>
      <div class="hint">Token 仅存于本地浏览器，不会上传到任何地方。</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="overlay" id="wipeOverlay" onclick="if(event.target===this)closeWipe()">
    <div class="modal">
      <h2>🗑 清空确认</h2>
      <p id="wipeMsg"></p>
      <div class="btn-row">
        <button class="btn-cancel" onclick="closeWipe()">取消</button>
        <button class="btn-danger" onclick="doWipe()">确认清空</button>
      </div>
      <div class="hint">误删可用 Ctrl+Z 撤销，或从 🕘 快照恢复。</div>
    </div>
  </div>
  <div class="overlay" id="snapOverlay" onclick="if(event.target===this)closeSnaps()">
    <div class="modal snap-modal">
      <div class="snap-body">
        <div class="snap-side">
          <div class="snap-side-head">
            <h2>🕘 快照</h2>
            <span class="snap-total" id="snapTotal"></span>
            <button class="icon-btn" onclick="closeSnaps()" title="关闭 (Esc)">✕</button>
          </div>
          <div class="snap-list" id="snapList"></div>
        </div>
        <div class="snap-main">
          <div class="snap-main-head">
            <div class="snap-title" id="snapTitle">点击左侧快照查看</div>
            <div class="snap-actions" id="snapActions" style="display:none">
              <button class="icon-btn primary" onclick="restoreCurrentSnap()">⬇ 恢复此快照</button>
              <button class="icon-btn danger" onclick="deleteCurrentSnap()" title="删除此快照">🗑</button>
            </div>
          </div>
          <div class="snap-preview" id="snapPreview"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const GIST_ID = "dd25f3f3146708c665989536b5797f1a";
    const TOKEN_KEY = "sticky_token_v1";
    const COLW_KEY = "sticky_colw_v1";
    const DEF_FR = [0.6, 1.2, 3, 1.5, 1.5]; // 默认列宽比例：状态/时间/内容描述/综合情况/回归情况
    const ROWS = 15, COLS = 5;
    const GROUPS = [
      { name: "wwd", start: 0 },
      { name: "wwdb", start: 5 },
      { name: "newdb", start: 10 }
    ];
    let data = { lines: Array.from({length: ROWS}, () => ["","","","",""]), snapshots: [] };
    let saveTimer = null;
    let undoStack = [], redoStack = [];
    let lastEdit = { r: -1, c: -1, t: 0 };

    function getToken() { return localStorage.getItem(TOKEN_KEY); }

    function openSetup() {
      document.getElementById("setupOverlay").classList.add("show");
      setTimeout(() => document.getElementById("tokenInput").focus(), 100);
    }
    function closeSetup() { document.getElementById("setupOverlay").classList.remove("show"); }

    function saveToken() {
      const token = document.getElementById("tokenInput").value.trim();
      const err = document.getElementById("errMsg");
      if (!token) { err.textContent = "请输入 Token"; err.style.display = "block"; return; }
      fetch(`https://api.github.com/gists/${GIST_ID}`, { headers: { Authorization: `token ${token}` } })
        .then(r => { if (!r.ok) throw new Error("Token 无效或无权限"); return r.json(); })
        .then(g => {
          localStorage.setItem(TOKEN_KEY, token);
          closeSetup();
          document.getElementById("errMsg").style.display = "none";
          document.getElementById("tokenInput").value = "";
          loadFromGist(g);
        })
        .catch(e => { err.textContent = "验证失败: " + e.message; err.style.display = "block"; });
    }

    async function init() {
      const token = getToken();
      if (!token) { openSetup(); return; }
      try {
        const r = await fetch(`https://api.github.com/gists/${GIST_ID}`, { headers: { Authorization: `token ${token}` } });
        if (r.status === 401 || r.status === 403) { openSetup(); return; }
        if (!r.ok) throw new Error("HTTP " + r.status);
        loadFromGist(await r.json());
      } catch (e) {
        document.getElementById("app").innerHTML = `<div class="loading-screen">❌ 加载失败: ${e.message}<br><span style="font-size:12px;color:var(--dim)">检查网络或 Token 设置</span></div>`;
      }
    }

    function loadFromGist(g) {
      const f = g.files && g.files["data.json"];
      if (f && f.content) {
        try {
          const p = JSON.parse(f.content);
          if (p.lines && Array.isArray(p.lines)) {
            for (let i = 0; i < ROWS; i++) {
              if (!p.lines[i]) p.lines[i] = ["","","","",""];
              if (p.lines[i].length === 4) p.lines[i].unshift(""); // 旧4列数据：前插空"状态"格
              while (p.lines[i].length < COLS) p.lines[i].push("");
            }
            data = {
              lines: p.lines,
              snapshots: Array.isArray(p.snapshots)
                ? p.snapshots.filter(s => s && Array.isArray(s.lines)).slice(0, 10)
                : []
            };
            undoStack = []; redoStack = []; lastEdit = { r: -1, c: -1, t: 0 };
          }
        } catch(e) { console.error("Parse error:", e); }
      }
      render();
      setStatus("saved");
      updateSnapBtn();
      updateUndoBtns();
    }

    async function saveGist() {
      const token = getToken();
      if (!token) { openSetup(); return; }
      setStatus("saving");
      try {
        const r = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
          method: "PATCH",
          headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify({
            description: "Sticky Notes Data",
            files: { "data.json": { content: JSON.stringify({ lines: data.lines, snapshots: data.snapshots || [] }, null, 2) } }
          })
        });
        if (!r.ok) { const e = await r.json(); throw new Error(e.message || "HTTP " + r.status); }
        setStatus("saved");
      } catch (e) {
        setStatus("error", e.message);
      }
    }

    function forceSave() { if (saveTimer) clearTimeout(saveTimer); saveGist(); }
    function debounceSave() {
      if (saveTimer) clearTimeout(saveTimer);
      setStatus("unsaved");
      saveTimer = setTimeout(saveGist, 1500);
    }

    function setStatus(s, msg) {
      const el = document.getElementById("status");
      el.className = "status " + s;
      const t = el.querySelector(".text");
      if (s === "saved") t.textContent = "✓ " + new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
      else if (s === "saving") t.textContent = "保存中...";
      else if (s === "unsaved") t.textContent = "编辑中...";
      else if (s === "error") t.textContent = "❌ " + (msg||"失败");
    }

    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

    function render() {
      let h = "";
      for (const g of GROUPS) {
        h += `<div class="section ${g.name}"><div class="section-title">${g.name.toUpperCase()}<button class="wipe-btn" onclick="confirmWipe('${g.name}')" title="清空该区 5 行内容">🗑 清空</button></div>`;
        for (let i = 0; i < 5; i++) {
          const r = g.start + i;
          const label = `${g.name}${i+1}`;
          h += `<div class="row ${g.name}"><div class="row-label">${label}</div><div class="inputs">`;
          for (let c = 0; c < COLS; c++) {
            const v = (data.lines[r] && data.lines[r][c]) || "";
            const ph = c===0?"状态":c===1?"时间":c===2?"内容描述":c===3?"综合情况":"回归情况";
            const isUrl = c===COLS-1 && v.match(/^https?:\/\//);
            const cls = (c===COLS-1 && isUrl)?"col-link":"";
            h += `<div class="input-wrap"><div class="input-box"><input type="text" class="${cls}" value="${esc(v)}" data-r="${r}" data-c="${c}" oninput="edit(${r},${c},this.value)" placeholder="${ph}">`;
            if (c===COLS-1) h += `<button class="open-link ${isUrl?'has-url':''}" onclick="window.open('${esc(v)}','_blank')" tabindex="-1">↗</button>`;
            h += `</div><button class="clear-btn" onclick="clearCell(${r},${c})" title="清空此格" tabindex="-1">✕</button>`;
            if (c < COLS-1) h += `<div class="col-handle" onpointerdown="startDrag(event,${c})" ondblclick="resetCols()" title="拖动调整列宽（双击重置）"></div>`;
            h += `</div>`;
          }
          h += `</div></div>`;
        }
        h += `</div>`;
      }
      document.getElementById("app").innerHTML = h;
      applyCols();
    }

    /* ===== 列宽拖拽 ===== */
    let colW = null; // [w0,w1,w2] px，第4列自动占剩余空间
    function loadColW() {
      try {
        const s = JSON.parse(localStorage.getItem(COLW_KEY));
        if (Array.isArray(s) && s.length === COLS-1 && s.every(x => typeof x === "number" && x > 0)) colW = s;
      } catch(e) {}
    }
    function defaultColW(W) {
      const t = DEF_FR.reduce((a, b) => a + b, 0);
      const avail = Math.max(W - 24, 240);
      return Array.from({length: COLS-1}, (_, i) => Math.max(40, Math.round(DEF_FR[i] / t * avail)));
    }
    function isMobile() { return window.matchMedia("(max-width: 700px)").matches; }
    function applyCols() {
      if (isMobile()) {
        document.querySelectorAll(".inputs").forEach(el => el.style.gridTemplateColumns = "");
        return;
      }
      document.querySelectorAll(".inputs").forEach(el => {
        let w = (colW || defaultColW(el.clientWidth)).slice();
        w = w.map(x => Math.max(40, x));
        const maxSum = el.clientWidth - 90; // 给第4列留至少 90px
        const sum = w[0] + w[1] + w[2];
        if (sum > maxSum) { const k = maxSum / sum; w = w.map(x => Math.floor(x * k)); }
        el.style.gridTemplateColumns = `${w.join("px ")}px minmax(90px, 1fr)`;
      });
    }
    function startDrag(e, i) {
      if (isMobile()) return;
      e.preventDefault();
      const grid = e.target.closest(".inputs");
      if (!colW) colW = defaultColW(grid.clientWidth);
      else colW = colW.map(x => Math.max(40, x));
      const startX = e.clientX, start = colW[i];
      const others = colW.reduce((a, b, j) => a + (j === i ? 0 : b), 0);
      const maxW = grid.clientWidth - others - 90;
      const handle = e.target;
      handle.classList.add("dragging");
      document.body.style.cursor = "col-resize";
      function mv(ev) {
        colW[i] = Math.min(Math.max(40, start + (ev.clientX - startX)), maxW);
        applyCols();
      }
      function up() {
        document.removeEventListener("pointermove", mv);
        document.removeEventListener("pointerup", up);
        handle.classList.remove("dragging");
        document.body.style.cursor = "";
        localStorage.setItem(COLW_KEY, JSON.stringify(colW));
      }
      document.addEventListener("pointermove", mv);
      document.addEventListener("pointerup", up);
    }
    function resetCols() {
      colW = null;
      localStorage.removeItem(COLW_KEY);
      applyCols();
    }
    window.addEventListener("resize", applyCols);
    loadColW();

    /* ===== 撤销/重做 ===== */
    function pushUndo(r, c) {
      const now = Date.now();
      if (undoStack.length && lastEdit.r === r && lastEdit.c === c && now - lastEdit.t < 800) {
        lastEdit.t = now;
        return; // 同一格连续输入，合并为一步
      }
      undoStack.push(JSON.stringify(data.lines));
      if (undoStack.length > 200) undoStack.shift();
      redoStack.length = 0;
      lastEdit = { r, c, t: now };
      updateUndoBtns();
    }
    function applyState(s) {
      data.lines = JSON.parse(s);
      lastEdit = { r: -1, c: -1, t: 0 };
      render();
      debounceSave();
      updateUndoBtns();
    }
    function doUndo() {
      if (!undoStack.length) return;
      redoStack.push(JSON.stringify(data.lines));
      applyState(undoStack.pop());
    }
    function doRedo() {
      if (!redoStack.length) return;
      undoStack.push(JSON.stringify(data.lines));
      applyState(redoStack.pop());
    }
    function updateUndoBtns() {
      const u = document.getElementById("undoBtn");
      const r = document.getElementById("redoBtn");
      if (u) u.disabled = !undoStack.length;
      if (r) r.disabled = !redoStack.length;
    }

    function edit(r, c, v) {
      if (!data.lines[r]) data.lines[r] = ["","","","",""];
      pushUndo(r, c);
      data.lines[r][c] = v;
      // Update open-link visibility
      const input = document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
      if (input) {
        const btn = input.nextElementSibling;
        if (btn && btn.classList.contains("open-link")) {
          btn.classList.toggle("has-url", /^https?:\/\//.test(v));
          input.classList.toggle("col-link", /^https?:\/\//.test(v));
          btn.onclick = () => window.open(v, "_blank");
        }
      }
      debounceSave();
    }

    /* ===== 分区清空 ===== */
    let wipeTarget = null;
    function confirmWipe(gname) {
      const g = GROUPS.find(x => x.name === gname);
      if (!g) return;
      let filled = 0;
      for (let i = 0; i < 5; i++) {
        const row = data.lines[g.start + i] || [];
        for (let c = 0; c < COLS; c++) if (row[c]) filled++;
      }
      if (!filled) { showToast(gname.toUpperCase() + " 区已是空的"); return; }
      wipeTarget = g;
      document.getElementById("wipeMsg").innerHTML =
        `将清空 <b style="color:var(--${g.name})">${g.name.toUpperCase()}</b> 区全部 5 行（25 格）内容，确定吗？`;
      document.getElementById("wipeOverlay").classList.add("show");
    }
    function closeWipe() {
      document.getElementById("wipeOverlay").classList.remove("show");
      wipeTarget = null;
    }
    function doWipe() {
      if (!wipeTarget) return;
      pushUndo(-1, -1);
      for (let i = 0; i < 5; i++) {
        if (data.lines[wipeTarget.start + i]) data.lines[wipeTarget.start + i] = ["","","","",""];
      }
      const name = wipeTarget.name.toUpperCase();
      render();
      debounceSave();
      closeWipe();
      showToast("已清空 " + name + "（Ctrl+Z 可撤销）");
    }

    function clearCell(r, c) {
      if (!data.lines[r]) data.lines[r] = ["","","","",""];
      pushUndo(r, c);
      data.lines[r][c] = "";
      const input = document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
      if (input) {
        input.value = "";
        edit(r, c, "");
      }
    }

    /* ===== 快照 ===== */
    const SNAP_MAX = 10;
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
    }
    function takeSnapshot() {
      if (!data.snapshots) data.snapshots = [];
      data.snapshots.push({ t: Date.now(), lines: JSON.parse(JSON.stringify(data.lines)) });
      while (data.snapshots.length > SNAP_MAX) data.snapshots.shift();
      if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
      saveGist();
      showToast("📸 快照已存（第 " + data.snapshots.length + " 格）");
      updateSnapBtn();
    }
    function updateSnapBtn() {
      const b = document.getElementById("snapBtn");
      if (b) b.textContent = "🕘 快照" + ((data.snapshots && data.snapshots.length) ? " (" + data.snapshots.length + ")" : "");
    }
    function openSnaps() {
      let idx = -1;
      if (data.snapshots && data.snapshots.length) idx = data.snapshots.length - 1; // 默认选中最新
      renderSnapList(idx);
      document.getElementById("snapOverlay").classList.add("show");
    }
    function closeSnaps() {
      document.getElementById("snapOverlay").classList.remove("show");
    }
    function fmtT(t) {
      return new Date(t).toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }
    function snapIdle() {
      document.getElementById("snapTitle").textContent = "点击左侧快照查看";
      document.getElementById("snapTitle").classList.remove("ready");
      document.getElementById("snapActions").style.display = "none";
      document.getElementById("snapPreview").innerHTML = '<div class="snap-placeholder">🕘</div>';
    }
    function renderSnapList(activeIdx) {
      const list = document.getElementById("snapList");
      const total = document.getElementById("snapTotal");
      if (!data.snapshots || !data.snapshots.length) {
        list.innerHTML = '<div class="snap-none">暂无快照<br>点顶部「📸 存快照」创建</div>';
        total.textContent = "";
        snapIdle();
        return;
      }
      total.textContent = data.snapshots.length + "/" + SNAP_MAX;
      let h = "";
      for (let i = data.snapshots.length - 1; i >= 0; i--) {
        const s = data.snapshots[i];
        const filled = s.lines.filter(r => r && r.some(c => c)).length;
        h += `<div class="snap-item${i === activeIdx ? " active" : ""}" onclick="viewSnap(${i})">`
          + `<div class="time">${i === data.snapshots.length - 1 ? "🌟 " : ""}#${i+1} · ${fmtT(s.t)}</div>`
          + `<div class="count">${filled} 行有内容</div></div>`;
      }
      list.innerHTML = h;
      if (activeIdx >= 0) viewSnap(activeIdx, true);
      else snapIdle();
    }
    function viewSnap(i, skipScroll) {
      document.querySelectorAll(".snap-item").forEach(el => el.classList.remove("active"));
      const item = document.querySelector(`.snap-item[onclick="viewSnap(${i})"]`);
      if (item) item.classList.add("active");
      const title = document.getElementById("snapTitle");
      title.textContent = `#${i+1} · ${fmtT(data.snapshots[i].t)}`;
      title.classList.add("ready");
      const actions = document.getElementById("snapActions");
      actions.style.display = "flex";
      actions.dataset.idx = i;
      const lines = data.snapshots[i].lines;
      const CHIP_C = { wwd: "var(--wwd)", wwdb: "var(--wwdb)", newdb: "var(--newdb)" };
      let h = "";
      for (const g of GROUPS) {
        let rowsH = "";
        for (let k = 0; k < 5; k++) {
          const r = g.start + k, row = lines[r] || [];
          if (!row.some(c => c)) continue;
          const st = (row[0] || "").trim(), tm = row[1] || "", desc = row[2] || "";
          const comp = row[3] || "", reg = row[4] || "";
          const lnk = (/^https?:\/\//.test(row[4] || "")) ? row[4] : "";
          let stCls = "";
          if (/ok|pass|done|✓|完成/i.test(st)) stCls = "st-ok";
          else if (/wip|todo|issue|fail|❌|问题/i.test(st)) stCls = "st-warn";
          rowsH += `<div class="snap-card">`;
          rowsH += `<div class="snap-card-head">`;
          rowsH += `<span class="chip" style="color:${CHIP_C[g.name]};border-color:${CHIP_C[g.name]}">${g.name}${k+1}</span>`;
          if (st) rowsH += `<span class="st ${stCls}">${esc(st)}</span>`;
          if (tm) rowsH += `<span class="tm">🕐 ${esc(tm)}</span>`;
          if (lnk) rowsH += `<a class="lnk" href="${esc(lnk)}" target="_blank">🔗 链接</a>`;
          rowsH += `</div>`;
          if (desc) rowsH += `<div class="main">${esc(desc)}</div>`;
          let sub = "";
          if (comp) sub += `<span>综合<b>${esc(comp)}</b></span>`;
          if (reg) sub += `<span>回归<b>${esc(reg)}</b></span>`;
          if (sub) rowsH += `<div class="sub">${sub}</div>`;
          rowsH += `</div>`;
        }
        if (rowsH) h += `<div class="section-title" style="border-color:var(--${g.name});color:var(--${g.name})">${g.name.toUpperCase()}</div>` + rowsH;
      }
      document.getElementById("snapPreview").innerHTML = h || '<div style="color:var(--dim);font-size:13px;padding:24px 0;text-align:center">（空快照）</div>';
      if (!skipScroll) {
        const pv = document.getElementById("snapPreview");
        if (pv) pv.scrollTop = 0;
        if (item) item.scrollIntoView({ block: "nearest" });
      }
    }
    function currentSnapIdx() {
      const a = document.getElementById("snapActions");
      return (a && a.style.display !== "none") ? parseInt(a.dataset.idx, 10) : -1;
    }
    function restoreCurrentSnap() {
      const i = currentSnapIdx();
      if (i >= 0) restoreSnap(i);
    }
    function deleteCurrentSnap() {
      const i = currentSnapIdx();
      if (i < 0) return;
      data.snapshots.splice(i, 1);
      if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
      saveGist();
      updateSnapBtn();
      let next = -1;
      if (data.snapshots.length) next = Math.min(i, data.snapshots.length - 1);
      renderSnapList(next);
      showToast("已删除快照 #" + (i+1));
    }
    function restoreSnap(i) {
      undoStack.push(JSON.stringify(data.lines));
      if (undoStack.length > 200) undoStack.shift();
      redoStack.length = 0;
      data.lines = JSON.parse(JSON.stringify(data.snapshots[i].lines));
      for (let r = 0; r < ROWS; r++) {
        if (!data.lines[r]) data.lines[r] = ["","","","",""];
        while (data.lines[r].length < COLS) data.lines[r].push("");
      }
      lastEdit = { r: -1, c: -1, t: 0 };
      render();
      updateUndoBtns();
      closeSnaps();
      if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
      saveGist();
      showToast("已恢复快照 #" + (i+1) + "（Ctrl+Z 可撤销）");
    }

    document.addEventListener("keydown", e => {
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key === "s") { e.preventDefault(); forceSave(); }
      if (mod && (e.key.toLowerCase() === "z" || e.code === "KeyZ")) {
        e.preventDefault();
        if (e.shiftKey) doRedo(); else doUndo();
      }
      if (mod && (e.key.toLowerCase() === "y" || e.code === "KeyY")) { e.preventDefault(); doRedo(); }
      if (e.key === "Escape") {
        if (document.getElementById("snapOverlay").classList.contains("show")) closeSnaps();
        if (document.getElementById("wipeOverlay").classList.contains("show")) closeWipe();
      }
    });
    document.getElementById("tokenInput").addEventListener("keydown", e => {
      if (e.key === "Enter") saveToken();
      if (e.key === "Escape") closeSetup();
    });

    init();
  </script>
</body>
</html>
